name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "*.zip"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - working-directory: kitchen-tools-android
        run: |
          npm install @capacitor/core @capacitor/android @capacitor-community/speech-recognition @fontsource-variable/fraunces @fontsource-variable/inter
          npm install -D @capacitor/cli
          npx cap add android
          npm run sync
      - working-directory: kitchen-tools-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-tools-apk
          path: kitchen-tools-android/android/app/build/outputs/apk/debug/app-debug.apk
