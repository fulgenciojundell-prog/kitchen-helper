name: Build APK with wake word

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q "*.zip"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install click pypinyin

      - name: Build wake-word APK
        working-directory: kitchen-tools-android
        run: bash wakeword/ci-build.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wakeword-build-log
          path: kitchen-tools-android/build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-tools-wakeword-apk
          path: kitchen-tools-android/android/app/build/outputs/apk/debug/app-debug.apk
